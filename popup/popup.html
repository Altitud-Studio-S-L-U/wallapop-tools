<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
  <title>Wallapop Tools</title>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <img src="../icons/icon48.png" alt="" class="header-logo" width="28" height="28">
    <div class="header-info">
      <div class="header-title">Wallapop Tools</div>
      <div class="header-status">
        <span class="status-dot" id="status-dot"></span>
        <span class="status-label" id="status-label" data-i18n="statusVerifying"></span>
      </div>
    </div>
    <select id="language-select" class="lang-select" title="Idioma">
      <option value="es">ES</option>
      <option value="en">EN</option>
      <option value="fr">FR</option>
      <option value="it">IT</option>
      <option value="pt_PT">PT</option>
    </select>
  </header>

  <!-- ===== STATS ===== -->
  <section class="stats">
    <div class="stat">
      <div class="stat-value" id="stat-items">-</div>
      <div class="stat-label" data-i18n="labelProducts"></div>
    </div>
    <div class="stat">
      <div class="stat-value" id="stat-last-republish">-</div>
      <div class="stat-label" data-i18n="labelLastRepublish"></div>
    </div>
    <div class="stat">
      <div class="stat-value" id="stat-republishes">0</div>
      <div class="stat-label" data-i18n="labelTotalRepublishes"></div>
    </div>
  </section>

  <!-- ===== REPUBLISH ===== -->
  <section class="section">
    <button class="btn btn-primary btn-big" id="btn-republish" disabled>
      <span class="btn-icon">&#8635;</span>
      <span data-i18n="btnRepublishAll"></span>
    </button>

    <div class="progress" id="progress-section">
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="progress-text" id="progress-text"></div>
    </div>
  </section>

  <!-- ===== AUTO-REPUBLISH ===== -->
  <section class="section section-row">
    <div class="row-left">
      <span class="section-label" data-i18n="labelAutoRepublish"></span>
    </div>
    <div class="row-right">
      <select id="auto-republish-interval" class="select-sm">
        <option value="6">6h</option>
        <option value="12" selected>12h</option>
        <option value="24">24h</option>
        <option value="48">48h</option>
      </select>
      <label class="toggle">
        <input type="checkbox" id="auto-republish-toggle">
        <span class="toggle-track"></span>
      </label>
    </div>
  </section>

  <div class="divider"></div>

  <!-- ===== PRODUCTS LIST ===== -->
  <section class="section" id="products-section">
    <div class="products-header">
      <label class="select-all-label">
        <input type="checkbox" id="select-all" checked>
        <span id="select-all-text" data-i18n="labelSelectAll"></span>
      </label>
      <span class="stale-badge-summary" id="stale-summary"></span>
    </div>

    <div class="products-list" id="products-list">
      <div class="products-empty" id="products-empty" data-i18n="statusLoadingProducts"></div>
    </div>
  </section>

  <!-- ===== PRICE CONTROLS ===== -->
  <section class="section price-controls" id="price-section">
    <div class="price-stepper">
      <button class="stepper-btn" id="price-minus">&minus;</button>
      <input type="number" class="stepper-input" id="price-percent" value="5" min="1" max="50" step="1">
      <button class="stepper-btn" id="price-plus">+</button>
      <span class="stepper-label">%</span>
    </div>
    <div class="price-actions">
      <button class="btn btn-outline" id="btn-lower" disabled>
        <span class="btn-icon">&darr;</span><span data-i18n="btnLowerPrice"></span>
      </button>
      <button class="btn btn-outline" id="btn-raise" disabled>
        <span class="btn-icon">&uarr;</span><span data-i18n="btnRaisePrice"></span>
      </button>
    </div>
    <button class="btn btn-ghost btn-sm" id="btn-republish-selected" disabled>
      <span class="btn-icon">&#8635;</span>
      <span data-i18n="btnRepublishSelected"></span>
    </button>
  </section>

  <div class="divider"></div>

  <!-- ===== ACTIVITY + EXPORT (collapsible) ===== -->
  <section class="section">
    <button class="collapse-toggle" id="activity-toggle">
      <span class="collapse-arrow" id="activity-arrow">&#9656;</span>
      <span data-i18n="labelRecentActivity"></span>
    </button>
    <div class="activity-list" id="activity-list" style="display:none;"></div>
  </section>

  <section class="section section-row">
    <button class="btn btn-ghost btn-sm" id="btn-export-csv">
      <span class="btn-icon">&#128229;</span>
      <span data-i18n="btnExportCSV"></span>
    </button>
  </section>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <span class="footer-version" id="extension-version"></span>
    <a href="https://altitudstudio.ad" target="_blank" rel="noopener" class="footer-link">
      <span data-i18n="footerBy"></span>
    </a>
  </footer>

  <script src="../utils/i18n-runtime.js"></script>
  <script src="popup.js"></script>
</body>
</html>
